# Docker Compose 配置 - 物流路径规划系统
# 本地/演示版：Flask 后端 + Vue/Nginx 前端。
# 生产部署请优先使用 docker-compose.prod.yml + .env.production。

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistics-backend
    ports:
      - "5000:5000"
    environment:
      # Flask 配置
      - FLASK_CONFIG=docker
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      
      # 安全密钥（生产环境请通过 .env/.env.production 注入）
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-change-me}
      
      # API Keys
      - AMAP_WEB_KEY=${AMAP_WEB_KEY:-}
      - AMAP_SERVICE_KEY=${AMAP_SERVICE_KEY:-}
      - AMAP_KEY=${AMAP_SERVICE_KEY:-}
      - TIANAPI_KEY=${TIANAPI_KEY:-}
      - TIANDITU_BROWSER_KEY=${TIANDITU_BROWSER_KEY:-}
      - TIANDITU_SERVER_KEY=${TIANDITU_SERVER_KEY:-}
      
    volumes:
      # 数据持久化
      - ./data:/app/data
      - ./logs:/app/logs
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - logistics-network

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logistics-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - logistics-network

# ==================== 数据卷 ====================
volumes:
  data:
    driver: local
  logs:
    driver: local

# ==================== 网络 ====================
networks:
  logistics-network:
    driver: bridge
    name: logistics-network

# ==================== 使用说明 ====================
# 
# 启动服务：
#   docker-compose up -d
#
# 查看日志：
#   docker-compose logs -f
#
# 停止服务：
#   docker-compose down
#
# 重新构建：
#   docker-compose build --no-cache
#   docker-compose up -d
#
# 访问地址：
#   前端：http://localhost:8080
#   后端：http://localhost:5000
#   默认账号：admin / admin123
#
# 生产环境注意：
#   1. 修改 SECRET_KEY 和 JWT_SECRET_KEY
#   2. 配置 HTTPS（添加 SSL 证书）
#   3. 修改默认密码
#   4. 配置防火墙规则
