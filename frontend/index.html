<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流路径规划系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 高德地图 JS API：通过 .env.local / .env.development 注入，不在仓库硬编码真实 key。 -->
    <script type="module">
      const amapSecurityKey = import.meta.env.VITE_AMAP_SECURITY_KEY
      const amapKey = import.meta.env.VITE_AMAP_KEY
      if (amapSecurityKey) {
        window._AMapSecurityConfig = { securityJsCode: amapSecurityKey }
      }
      if (amapKey) {
        const script = document.createElement('script')
        script.type = 'text/javascript'
        script.async = false
        script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(amapKey)}`
        document.head.appendChild(script)
      } else {
        console.info('[AMap] VITE_AMAP_KEY is not configured; browser map provider will rely on backend/provider fallbacks.')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
